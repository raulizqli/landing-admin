name: Publish packages to GitHub Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'packages-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@raulizqli'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish @raulizqli/landing-core
        run: npm publish -w packages/landing-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @raulizqli/landing-ui
        run: npm publish -w packages/landing-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
