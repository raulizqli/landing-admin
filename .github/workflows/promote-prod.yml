# Manual promote to Prod after Stage sign-off.
# Uses GitHub Environment "prod" (configure required reviewers).
# Prod hosting is NOT auto-deployed on merge (Phase C). See docs/deploy-strategy.md.

name: Promote to Prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type promote to confirm production deploy'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event.inputs.confirm == 'promote' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Unit tests (landing-core)
        run: npm run test:core

      - name: Unit tests (landing-admin)
        run: npm test --prefix landing-admin

      - name: Lint Firebase client usage (admin)
        run: npm run lint:firebase-clients

      - name: Smoke admin bootstrap imports
        run: npm run smoke:admin-bootstrap

      - name: Env guardrails (production)
        run: node scripts/check-env.mjs --mode production --env prod
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.VITE_APP_CHECK_DEBUG_TOKEN }}
          VITE_FUNCTIONS_EMULATOR_HOST: ${{ vars.VITE_FUNCTIONS_EMULATOR_HOST }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_STARTER: ${{ secrets.STRIPE_PRICE_STARTER }}
          STRIPE_PRICE_STARTER_USD: ${{ secrets.STRIPE_PRICE_STARTER_USD }}
          STRIPE_PRICE_STARTER_MXN: ${{ secrets.STRIPE_PRICE_STARTER_MXN }}
          STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_PRO_USD: ${{ secrets.STRIPE_PRICE_PRO_USD }}
          STRIPE_PRICE_PRO_MXN: ${{ secrets.STRIPE_PRICE_PRO_MXN }}
          STRIPE_PRICE_AGENCY: ${{ secrets.STRIPE_PRICE_AGENCY }}
          STRIPE_PRICE_AGENCY_USD: ${{ secrets.STRIPE_PRICE_AGENCY_USD }}
          STRIPE_PRICE_AGENCY_MXN: ${{ secrets.STRIPE_PRICE_AGENCY_MXN }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}

      - name: Build admin
        run: npm run build:admin
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_RECAPTCHA_ENTERPRISE: ${{ vars.VITE_RECAPTCHA_ENTERPRISE || 'true' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_TEMPLATE_PREVIEW_URL: https://web.toqua.site
          VITE_MARKETING_URL: https://toqua.site
          VITE_CORPORATE_SITE_URL: ${{ vars.VITE_CORPORATE_SITE_URL || 'https://toqua.site' }}
          VITE_BOOTSTRAP_ROOT_EMAIL: ${{ secrets.VITE_BOOTSTRAP_ROOT_EMAIL }}
          VITE_APP_ENV: prod
          VITE_GOOGLE_ADS_CLIENT: ${{ secrets.VITE_GOOGLE_ADS_CLIENT }}
          VITE_GOOGLE_ADS_SLOT: ${{ secrets.VITE_GOOGLE_ADS_SLOT_ADMIN }}
          VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID || '1613320007179076' }}

      - name: Build template
        run: npm run build:template
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_PAGINA_ID: ${{ secrets.VITE_PAGINA_ID || 'leftsidedev' }}
          VITE_ADMIN_PUBLIC_URL: ${{ secrets.VITE_ADMIN_PUBLIC_URL }}
          VITE_ADMIN_ORIGIN: ${{ secrets.VITE_ADMIN_ORIGIN }}
          VITE_GOOGLE_ADS_CLIENT: ${{ secrets.VITE_GOOGLE_ADS_CLIENT }}
          VITE_GOOGLE_ADS_SLOT: ${{ secrets.VITE_GOOGLE_ADS_SLOT }}

      - name: Deploy hosting (admin)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDING_ADMIN_9452E }}
          channelId: live
          projectId: landing-admin-9452e
          entryPoint: .
          target: admin

      - name: Deploy hosting (template)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDING_ADMIN_9452E }}
          channelId: live
          projectId: landing-admin-9452e
          entryPoint: landing-template
          target: template

      - name: Build toqua-site
        run: npm run build:toqua
        env:
          VITE_ADMIN_URL: https://admin.toqua.site

      - name: Deploy hosting (toqua-site)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDING_ADMIN_9452E }}
          channelId: live
          projectId: landing-admin-9452e
          entryPoint: toqua-site
          target: toqua-marketing

      - name: Smoke production hosting
        run: |
          node scripts/smoke-hosting.mjs --url https://admin.toqua.site --path /login --label admin
          node scripts/smoke-hosting.mjs --url https://web.toqua.site --label template
          node scripts/smoke-hosting.mjs --url https://toqua.site --path /es --label toqua-marketing
